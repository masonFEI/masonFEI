name: Generate snake animation

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake (white-red theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ef4444&color_dots=#ffffff,#fee2e2,#fca5a5,#ef4444,#b91c1c
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ef4444&color_dots=#0d1117,#7f1d1d,#991b1b,#dc2626,#ef4444

      - name: Push dist/ to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
